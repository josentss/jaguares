name: Verificacion fase 00-01

on:
  push:
    branches:
      - seguridad/fase-00-01-validaciones
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Sintaxis y pruebas backend
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jaguares_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jaguares_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jaguares_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar sintaxis de JavaScript
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n 1 node --check
      - name: Ejecutar pruebas con mocks
        run: node --test tests/seguridad.test.js tests/estados-y-sesiones.test.js tests/formularios.test.js tests/fechas.test.js tests/postgres-config.test.js tests/pagos-pg.test.js tests/integridad-pg.test.js
      - name: Preparar Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/jaguares-playwright" --no-save --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/jaguares-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Probar interfaz en escritorio y movil
        env:
          NODE_PATH: ${{ runner.temp }}/jaguares-playwright/node_modules
        run: node --test tests/interfaz.test.js tests/flujos-web-pg.test.js
      - name: Guardar capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: test-artifacts/
          if-no-files-found: ignore
