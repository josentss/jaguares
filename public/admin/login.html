<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Club Jaguares</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <a href="../index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver al inicio</a>

        <div class="login-card">
            <div class="login-header">
                <img src="../img/logo-sinfondo.png" alt="Logo Jaguares" class="login-logo">
                <h2>Sistema de gestión</h2>
                <p id="form-description">Ingresa tus datos para acceder al sistema.</p>
            </div>

            <div class="form-tabs">
                <button id="tab-login" class="tab-btn active">Iniciar Sesión</button>
                <button id="tab-register" class="tab-btn">Registrarse</button>
            </div>

            <form id="form-login" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-auth">Ingresar <i class="fas fa-sign-in-alt"></i></button>
            </form>

            <form id="form-register" class="auth-form">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <div class="input-group" style="flex: 1;">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-names" placeholder="Nombres" required>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-lastnames" placeholder="Apellidos" required>
                    </div>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="reg-email" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Contraseña (Mín. 8 caracteres)" required minlength="8">
                </div>

                <p class="info-note"><i class="fas fa-info-circle"></i> Todo nuevo registro debe esperar la aceptación de la Directiva.</p>

                <button type="submit" class="btn-auth">Crear Cuenta <i class="fas fa-user-plus"></i></button>
            </form>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
