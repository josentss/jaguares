         </button>
         <button type="button" class="galeria-item" data-full="img/u9-card.jpeg" data-alt="Categoría U-9">

         <button type="button" class="galeria-item" data-full="img/u11-card.jpeg" data-alt="Categoría U-11">

   <!-- Lightbox -->
   <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Vista de foto">
      <button type="button" class="lightbox-close" aria-label="Cerrar"><i class="fas fa-times"></i></button>
      <button type="button" class="lightbox-prev" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>
      <img id="lightbox-img" src="" alt="">
      <button type="button" class="lightbox-next" aria-label="Siguiente"><i class="fas fa-chevron-right"></i></button>
   </div>

   <footer>
      <div class="footer-bottom" style="border-top:none;padding-top:24px;">
         <p><a href="index.html" style="color:var(--naranja);text-decoration:none;font-weight:600;">← Volver al inicio</a></p>
         <p>© 2026 Club de Voleibol Jaguares</p>
      </div>
   </footer>

   <script src="script.js"></script>
   <script>
   (function () {
       const items = Array.from(document.querySelectorAll('.galeria-item'));
       const lb = document.getElementById('lightbox');
       const lbImg = document.getElementById('lightbox-img');
       const btnClose = document.querySelector('.lightbox-close');
       const btnPrev = document.querySelector('.lightbox-prev');
       const btnNext = document.querySelector('.lightbox-next');
       if (!items.length || !lb || !lbImg) return;

       let idx = 0;

       function openAt(i) {
           idx = (i + items.length) % items.length;
           const el = items[idx];
           lbImg.src = el.dataset.full || el.querySelector('img').src;
           lbImg.alt = el.dataset.alt || '';
           lb.hidden = false;
           document.body.classList.add('modal-open');
           if (btnClose) btnClose.focus({ preventScroll: true });
       }

       function closeLb() {
           lb.hidden = true;
           lbImg.src = '';
           document.body.classList.remove('modal-open');
       }

       items.forEach((el, i) => {
           el.addEventListener('click', () => openAt(i));
       });

       if (btnClose) btnClose.addEventListener('click', closeLb);
       if (btnPrev) btnPrev.addEventListener('click', () => openAt(idx - 1));
       if (btnNext) btnNext.addEventListener('click', () => openAt(idx + 1));

       lb.addEventListener('click', (e) => {
           if (e.target === lb) closeLb();
       });

       document.addEventListener('keydown', (e) => {
           if (lb.hidden) return;
           if (e.key === 'Escape') closeLb();
           if (e.key === 'ArrowLeft') openAt(idx - 1);
           if (e.key === 'ArrowRight') openAt(idx + 1);
       });
   })();

   document.querySelectorAll('.galeria-page .reveal').forEach(el => el.classList.add('active'));
   </script>
</body>
</html>
